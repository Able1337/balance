<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183d34"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=10"><title>Баланс — дневник калорий</title></head><body><div class="app"><header><a class="brand" href="./">◒ <span>баланс</span></a><button id="settings" class="icon" aria-label="Настройки">⚙</button></header><main id="main"></main><nav id="nav" hidden><button data-tab="calendar" class="active">▦ <span>Календарь</span></button><button data-tab="charts">⌁ <span>Графики</span></button><button data-tab="foods">≋ <span>Продукты</span></button><button data-tab="plan">◎ <span>Мой план</span></button></nav></div><dialog id="dayDialog"><form id="dayForm"><div class="dialog-head"><div><p class="eyebrow">ДНЕВНИК</p><h2 id="dayTitle"></h2></div><button type="button" class="icon" id="closeDay" aria-label="Закрыть">×</button></div><label>Вес, кг<input name="weight" type="number" min="20" max="500" step="0.1" placeholder="Необязательно"></label><p class="field-title">Как прошёл день?</p><div class="modes"><label><input type="radio" name="mode" value="0" checked><span>🪑<b>Сидячий</b><small>Спокойный день</small></span></label><label><input type="radio" name="mode" value="1"><span>🚶<b>Лёгкий</b><small>Немного движения</small></span></label><label><input type="radio" name="mode" value="2"><span>🏃<b>Активный</b><small>Умеренная нагрузка</small></span></label><label class="custom-mode"><input type="radio" name="mode" value="custom"><span>✎<b>Свой расход</b><small id="customHint">Ввести вручную</small><input aria-label="Общий расход за день, ккал" placeholder="ккал за день" name="spent" type="number" min="1" max="20000" step="1" hidden></span></label></div><div class="two"><label>Съедено, ккал<input name="intake" type="number" min="0" max="20000" required></label><label>Белок, г<input name="protein" type="number" min="0" max="1500" step="0.1" required></label></div><details class="manual-macros"><summary>Жиры, углеводы и клетчатка</summary><div class="two"><label>Жиры, г<input name="fat" type="number" min="0" max="1500" step="0.1" placeholder="Неизвестно"></label><label>Углеводы, г<input name="carbs" type="number" min="0" max="1500" step="0.1" placeholder="Неизвестно"></label></div><label>Клетчатка, г<input name="fiber" type="number" min="0" max="1500" step="0.1" placeholder="Неизвестно"></label></details><div id="dayEstimate" class="note"></div><button class="primary" type="submit">Сохранить день</button><button type="button" id="deleteDay" class="text danger">Удалить запись</button></form></dialog><div id="toast" role="status"></div><script src="chatgpt-import.js?v=10" defer></script><script src="app.js?v=10" defer></script><script src="ai-prompt.js?v=10" defer></script><script src="chatgpt-ui.js?v=10" defer></script></body></html>
